<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG-SONG Player + Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #10b981; cursor: pointer; margin-top: -4px; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }
        
        #yt-iframe-container { position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; }
        
        /* Custom scrollbar for search results */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4 text-slate-200">

    <div class="w-full max-w-md glass-panel rounded-2xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
        <h2 class="text-xl font-bold text-center mb-4 text-white tracking-wide">OG-SONG Stream</h2>

        <!-- Search Bar -->
        <div class="mb-4">
            <div class="flex gap-2">
                <input type="text" id="search-query" placeholder="Search any song..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500 transition-colors"
                    onkeypress="if(event.key === 'Enter') searchMusic()">
                <button onclick="searchMusic()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 rounded-lg font-medium transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
                </button>
            </div>
        </div>

        <!-- Search Results Area -->
        <div id="search-results" class="flex-1 overflow-y-auto custom-scroll mb-4 space-y-2 pr-1 hidden">
            <!-- Results will be injected here via JS -->
        </div>

        <!-- Player Controls Section -->
        <div id="player-ui" class="opacity-50 pointer-events-none transition-opacity duration-300 border-t border-slate-700 pt-4 mt-auto">
            <div class="flex items-center gap-4 mb-4">
                <img id="thumb-img" src="https://via.placeholder.com/64?text=YT" class="w-14 h-14 rounded-lg object-cover shadow-md">
                <div class="overflow-hidden flex-1">
                    <p id="song-title" class="text-sm font-semibold text-white truncate">No song selected</p>
                    <p id="song-artist" class="text-xs text-slate-400 mt-1 truncate">Ready to play</p>
                </div>
            </div>

            <div class="mb-4">
                <input type="range" id="seek-bar" value="0" min="0" max="100" step="1">
                <div class="flex justify-between text-[10px] text-slate-400 mt-2 font-medium font-mono">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="flex justify-center">
                <button id="play-pause-btn" onclick="togglePlay()" class="w-12 h-12 rounded-full bg-white text-slate-900 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 ml-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 hidden"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0A.75.75 0 0115 4.5h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Iframe Container -->
    <div id="yt-iframe-container"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isPlaying = false;
        let updateInterval;

        const playIcon = document.getElementById('icon-play');
        const pauseIcon = document.getElementById('icon-pause');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const thumbEl = document.getElementById('thumb-img');
        const playerUi = document.getElementById('player-ui');
        const resultsContainer = document.getElementById('search-results');

        // Format Seconds to M:SS
        function formatTime(time) {
            if (isNaN(time)) return "0:00";
            const minutes = Math.floor(time / 60);
            let seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }

        // Search YT Music using Piped API (CORS-Free Proxy)
        async function searchMusic() {
            const query = document.getElementById('search-query').value.trim();
            if(!query) return;

            resultsContainer.classList.remove('hidden');
            resultsContainer.innerHTML = `<p class="text-center text-sm text-slate-400 py-4 animate-pulse">Searching YouTube Music...</p>`;

            try {
                // Fetching specifically 'music_songs' filter
                const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                const data = await res.json();
                
                resultsContainer.innerHTML = "";
                
                if(data.items.length === 0) {
                    resultsContainer.innerHTML = `<p class="text-center text-sm text-red-400 py-4">No songs found.</p>`;
                    return;
                }

                // Render Top 10 Results
                data.items.slice(0, 10).forEach(item => {
                    // Extract Video ID from url (e.g., /watch?v=XXXXX)
                    const vidId = item.url.split('v=')[1];
                    const thumbUrl = item.thumbnail;
                    const title = item.title.replace(/'/g, "\\'");
                    const artist = item.uploaderName.replace(/'/g, "\\'");

                    resultsContainer.innerHTML += `
                        <div class="flex items-center gap-3 p-2 bg-slate-800 rounded-lg cursor-pointer hover:bg-slate-700 transition-colors" 
                             onclick="playSelectedSong('${vidId}', '${title}', '${artist}', '${thumbUrl}')">
                            <img src="${thumbUrl}" class="w-12 h-12 rounded object-cover">
                            <div class="overflow-hidden flex-1">
                                <p class="text-sm text-white font-bold truncate">${item.title}</p>
                                <p class="text-xs text-slate-400 truncate">${item.uploaderName} • ${item.duration > 0 ? formatTime(item.duration) : 'Audio'}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                resultsContainer.innerHTML = `<p class="text-center text-sm text-red-400 py-4">Network Error. Try again.</p>`;
            }
        }

        // Play the clicked song from search list
        function playSelectedSong(vidId, title, artist, thumbUrl) {
            // Update UI
            titleEl.innerText = title;
            artistEl.innerText = artist;
            thumbEl.src = thumbUrl;
            
            // Enable Player UI
            playerUi.classList.remove('opacity-50', 'pointer-events-none');
            resultsContainer.classList.add('hidden'); // Hide results while playing

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(vidId);
            } else {
                createPlayer(vidId);
            }
        }

        function createPlayer(videoId) {
            const container = document.getElementById('yt-iframe-container');
            container.innerHTML = '<div id="yt-player"></div>';

            player = new YT.Player('yt-player', {
                height: '10', width: '10',
                videoId: videoId,
                playerVars: {
                    'playsinline': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1
                },
                events: {
                    'onReady': (e) => e.target.playVideo(),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                
                const duration = player.getDuration();
                seekBar.max = duration;
                totalTimeEl.innerText = formatTime(duration);

                clearInterval(updateInterval);
                updateInterval = setInterval(updateSeekBar, 500);
                
                // Force lowest quality to save bandwidth
                player.setPlaybackQuality('small'); 

            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                clearInterval(updateInterval);
                
                if(event.data == YT.PlayerState.ENDED) {
                    seekBar.value = 0;
                    currentTimeEl.innerText = "0:00";
                }
            }
        }

        function togglePlay() {
            if (!player) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function updateSeekBar() {
            if (player && isPlaying) {
                const currentTime = player.getCurrentTime();
                seekBar.value = currentTime;
                currentTimeEl.innerText = formatTime(currentTime);
            }
        }

        seekBar.addEventListener('input', function() {
            if (player) {
                const seekToTime = seekBar.value;
                player.seekTo(seekToTime, true);
                currentTimeEl.innerText = formatTime(seekToTime);
            }
        });
    </script>
</body>
</html>
